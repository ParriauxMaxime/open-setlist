name = "open-setlist-proxy"
main = "index.js"
compatibility_date = "2024-12-01"

# Band relay (simple sync): one SQLite Durable Object per band.
[[durable_objects.bindings]]
name = "BANDS"
class_name = "Band"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Band"]

[vars]
# Web origins allowed to use the relay, comma-separated. Empty: any origin.
ALLOWED_ORIGINS = "https://parriauxmaxime.github.io"
