[package]
name = "open-setlist-companion"
version = "0.3.0"
edition = "2024"
description = "Plays the MIDI messages Open Setlist tablets send on song change, on the computer that runs Ableton Live"
license = "MIT"
repository = "https://github.com/ParriauxMaxime/open-setlist"
publish = false

[dependencies]
gethostname = "1"
httparse = "1.10"
if-addrs = "0.15"
midir = "0.11"
qrcodegen = "1.8"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ble-peripheral-rust = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Storage_Streams",
] }

[profile.release]
lto = true
strip = true
