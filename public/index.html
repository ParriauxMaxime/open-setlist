<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="<%= basePath %>manifest.json" />
    <link rel="icon" href="<%= basePath %>icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="<%= basePath %>icons/apple-touch-icon.png" />
    <title>Open Setlist</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recovery: if the app JS fails to load (stale SW serving old assets),
      // unregister SW, clear caches, and reload once.
      setTimeout(function () {
        var root = document.getElementById("root");
        // __openSetlistBooted: the JS did run (e.g. slow DB init on a cold device); wiping the
        // caches then would leave an offline device with nothing to load.
        if (root && root.children.length === 0 && !window.__openSetlistBooted && "serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var tasks = regs.map(function (r) { return r.unregister(); });
            if (caches && caches.keys) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
            Promise.all(tasks).then(function () {
              // Only reload once to avoid infinite loop
              if (!sessionStorage.getItem("sw-recovery")) {
                sessionStorage.setItem("sw-recovery", "1");
                location.reload();
              }
            });
          });
        }
      }, 3000);
    </script>
  </body>
</html>
