name: Companion

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
    tags: ["companion-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            file: open-setlist-companion-macos
          - os: windows-latest
            file: open-setlist-companion-windows.exe
          - os: ubuntu-latest
            file: open-setlist-companion-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: companion
    env:
      # The oldest macOS that runs on Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      # MIDI goes through ALSA; BlueZ is driven over D-Bus.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            companion/target
          key: companion-${{ runner.os }}-${{ hashFiles('companion/Cargo.lock') }}

      - name: The tag is the version of the program
        if: startsWith(github.ref, 'refs/tags/companion-v')
        run: test "companion-v$(cargo pkgid | sed 's/.*[#@]//')" = "$GITHUB_REF_NAME"

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Build
        if: runner.os != 'macOS'
        run: |
          cargo build --locked --release
          mkdir -p dist
          cp target/release/open-setlist-companion${{ runner.os == 'Windows' && '.exe' || '' }} dist/${{ matrix.file }}

      # One file for Apple Silicon and Intel. Signing it again, even without an identity,
      # ties the embedded Info.plist to the program.
      - name: Build for both kinds of Mac
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/${{ matrix.file }} \
            target/aarch64-apple-darwin/release/open-setlist-companion \
            target/x86_64-apple-darwin/release/open-setlist-companion
          codesign --force --sign - dist/${{ matrix.file }}
          lipo -archs dist/${{ matrix.file }}

      # Build machines have neither a MIDI port to offer nor Bluetooth: the program must
      # start all the same, say so, and still be there a moment later.
      - name: Start it
        run: |
          dist/${{ matrix.file }} --no-open --port 7801 &
          program=$!
          curl --silent --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7801/status
          sleep 8
          status=$(curl --silent --fail http://127.0.0.1:7801/status)
          echo "$status"
          grep -q '"app":"open-setlist-companion"' <<< "$status"
          if [ "$RUNNER_OS" != macOS ]; then grep -q '"midiOut":null' <<< "$status"; fi
          kill "$program"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: companion/dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the three programs to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Companion ${GITHUB_REF_NAME#companion-v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
